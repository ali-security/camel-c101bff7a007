name: PR Build (Camel 4)

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Optional surefire -Dtest filter (comma-separated test classes); empty runs the full suite'
        required: false
        default: ''

permissions: 
  contents: read

jobs:
  build:
    permissions:
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        java: ['17']
        experimental: [ false ]
        include:
          - java: '21'
            experimental: true

    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          persist-credentials: false
      - id: install-packages
        uses: ./.github/actions/install-packages
      - id: install-mvnd
        uses: ./.github/actions/install-mvnd
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@6a0805fcefea3d4657a47ac4c165951e33482018 # v4.2.2
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          cache: 'maven'
      - name: maven build (dependencies of camel-core-processor and camel-core)
        run: ./mvnw -B -V -e -ntp -Dquickly install -pl core/camel-core-processor,core/camel-core -am
      - name: mvn test (camel-core-processor + camel-core, whose suite covers the processors)
        env:
          TEST_FILTER: ${{ inputs.test-filter }}
        run: |
          ARGS="-B -V -e -ntp -Dci.env.name=github.com -Dsurefire.rerunFailingTestsCount=2 -Dfailsafe.rerunFailingTestsCount=2 -Dformatter.skip=true -Dimpsort.skip=true -Dlicense.skip=true"
          if [ -n "$TEST_FILTER" ]; then
            ARGS="$ARGS -Dtest=$TEST_FILTER -Dsurefire.failIfNoSpecifiedTests=false"
          fi
          ./mvnw $ARGS install -pl core/camel-core-processor,core/camel-core
      - name: upload camel-core-processor jar
        if: matrix.java == '21'
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        with:
          name: camel-core-processor-jar
          path: core/camel-core-processor/target/camel-core-processor-4.8.5.jar
          if-no-files-found: error
      - name: test summary and skipped tests
        if: always()
        shell: python3 {0}
        run: |
          import glob, xml.etree.ElementTree as ET
          from collections import defaultdict
          # outcomes per test id: surefire may record a flaky test's failed run as an extra
          # <testcase> entry (even inside another class's XML)
          outcomes = defaultdict(list)
          skipmsg = {}
          flaky = set()
          for f in glob.glob('core/*/target/surefire-reports/TEST-*.xml'):
              try:
                  r = ET.parse(f).getroot()
              except Exception:
                  continue
              for tc in r.iter('testcase'):
                  key = (tc.get('classname', ''), tc.get('name', ''))
                  if tc.find('flakyFailure') is not None or tc.find('flakyError') is not None:
                      flaky.add(key)
                  if tc.find('failure') is not None or tc.find('error') is not None:
                      outcomes[key].append('fail')
                  elif tc.find('skipped') is not None:
                      sk = tc.find('skipped')
                      lines = (sk.get('message') or sk.text or '').strip().splitlines()
                      skipmsg[key] = lines[0][:200] if lines else 'no message (upstream @Disabled without reason text)'
                      outcomes[key].append('skip')
                  else:
                      outcomes[key].append('pass')
          # count every <testcase> entry (parameterized tests share names), but drop a
          # 'fail' entry when the same test id also has a passing entry (flaky rerun)
          passed = skipped = 0
          failed = []
          reasons = defaultdict(list)
          for k, v in outcomes.items():
              if 'pass' in v and 'fail' in v:
                  flaky.add(k)
                  v = [o for o in v if o != 'fail']
              for o in v:
                  if o == 'pass':
                      passed += 1
                  elif o == 'skip':
                      skipped += 1
                      reasons[skipmsg[k]].append(k[0].split('.')[-1] + '.' + k[1])
                  else:
                      failed.append(k[0] + '.' + k[1])
          print('SKIPPED TESTS BY REASON (all upstream annotations/assumptions):')
          for msg, tests in sorted(reasons.items(), key=lambda x: -len(x[1])):
              print(f'SKIPPED ({len(tests)}) reason={msg}: {", ".join(sorted(tests)[:6])}' + (' ...' if len(tests) > 6 else ''))
          print(f'FLAKY (failed then passed on surefire rerunFailingTestsCount=2, counted as passed): {", ".join(sorted(c.split('.')[-1] + '.' + n for c, n in flaky)) or "none"}')
          if failed:
              print('FAILED: ' + ', '.join(failed))
          n = passed + skipped + len(failed)
          print('(surefire can write a rerun failure of one class into another class XML; deduped per test id, so totals match Maven "Tests run")')
          print(f'TEST SUMMARY: total={n} passed={passed} failures={len(failed)} skipped={skipped}')
